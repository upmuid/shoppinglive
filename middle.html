<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이중 iFrame 우회 - 중간 페이지</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #inner_frame { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <script>
        // 최종 쇼핑라이브 URL을 여러 조각으로 분리하여 난독화
        const url_chunk_1 = `https://view.shopping`;
        const url_chunk_2 = `live.naver.com/externals/npay/lives/1805050?tr=lim`;
        const url_chunk_3 = `&fm=shoppinglive&sn=home`;

        const final_live_url = url_chunk_1 + url_chunk_2 + url_chunk_3;
        
        // Step 5. 내부 iFrame (Inner iFrame)을 생성하고 최종 URL을 바로 할당
        const innerIframe = document.createElement('iframe');
        innerIframe.id = 'inner_frame';
        innerIframe.src = final_live_url;
        innerIframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin allow-popups');
        innerIframe.setAttribute('allow', 'fullscreen');

        document.body.appendChild(innerIframe);
        
        console.log("Step 5. 내부 iFrame 생성 및 최종 라이브 URL 로드 시작.");
    </script>

</body>
</html>
