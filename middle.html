<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이중 iFrame 우회 - 중간 페이지 (난독화)</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* iFrame이 로드되기 전까지 빈 화면을 숨김 */
        #loading_indicator { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-family: sans-serif; 
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="loading_indicator">최종 콘텐츠 로딩 중...</div>

    <script>
        // 최종 쇼핑라이브 URL을 여러 조각으로 분리하여 난독화
        const url_part1 = `https://view.shop`;
        const url_part2 = `pinglive.naver.com/externals/npay/lives/1805050?tr=lim`;
        const url_part3 = `&fm=shoppinglive&sn=home`;

        // 난독화된 함수 이름과 문자열 사용
        const functionName = 'create_and_load_frame';
        const elementTag = 'iframe';
        const idName = 'inner_frame_hidden';

        // 난독화된 함수 정의
        window[functionName] = function() {
            // 1. URL 조합
            const final_live_url = url_part1 + url_part2 + url_part3;

            // 2. 내부 iFrame 생성
            const innerIframe = document.createElement(elementTag);
            innerIframe.id = idName;
            innerIframe.style.width = '100%';
            innerIframe.style.height = '100%';
            innerIframe.style.border = 'none';

            // 3. 보안 속성 할당
            innerIframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-same-origin allow-popups');
            innerIframe.setAttribute('allow', 'fullscreen');

            // 4. 최종 URL 할당 (플레이어 로드 트리거)
            innerIframe.src = final_live_url;

            // 5. DOM에 추가
            document.body.appendChild(innerIframe);
            
            // 로딩 표시 제거
            const indicator = document.getElementById('loading_indicator');
            if (indicator) indicator.style.display = 'none';

            console.log("내부 iFrame 생성 및 최종 라이브 URL 로드 완료.");
        };

        // Middle Page 로드 후 500ms 추가 지연 후 난독화된 함수 실행
        document.addEventListener('DOMContentLoaded', function() {
            // 짧은 지연(0.5초)을 주어 DOM 조작 타이밍을 감지 로직으로부터 떨어뜨림
            setTimeout(() => {
                // 난독화된 함수 이름으로 함수 실행
                window[functionName]();
            }, 500); 
        });
    </script>

</body>
</html>
