<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이중 iFrame 우회 - 메인 페이지</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #outer_frame { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <iframe 
        id="outer_frame" 
        src="" 
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        allow="fullscreen"
    >
    </iframe>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('outer_frame');
            
            // --- 환경 설정 ---
            // Step 1: 더미 URL (기존 주소 사용)
            const dummy_url = `https://upmuid.github.io/shoppinglive/dummy.html`; 
            
            // Step 2: 중간 페이지 URL (새로 만들 HTML 파일의 주소)
            const middle_page_url = `https://upmuid.github.io/shoppinglive/middle.html`; // 이 주소를 여러분의 실제 URL로 변경해야 합니다.
            // ------------------

            let isDummyLoaded = false;

            // Step 4. 중간 페이지 URL로 변경하는 함수
            const loadMiddlePage = () => {
                iframe.src = middle_page_url;
                iframe.onload = null; 
                console.log("Step 4. Dummy 로드 완료. 중간 페이지 로드 시작.");
            };
            
            // Step 2. iFrame에 'onload' 이벤트 리스너를 추가하여 더미 페이지 로드 완료를 감지
            iframe.onload = function() {
                if (!isDummyLoaded) {
                    isDummyLoaded = true;
                    console.log("Step 2. Dummy 페이지 로드 완료.");
                    
                    // 2초 지연 후 중간 페이지 로드 (타이밍 우회)
                    setTimeout(() => {
                        loadMiddlePage();
                    }, 2000);
                }
            };

            // Step 1. 더미 URL을 iFrame의 src에 할당하여 로드를 시작합니다.
            console.log("Step 1. 더미 URL 로드 시작: " + dummy_url);
            iframe.src = dummy_url;
            
        });
    </script>

</body>
</html>
