<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 쇼핑라이브 웹뷰 우회 테스트 (순수 Blank 로드)</title>
    <style>
        /* 페이지 전체를 채우도록 설정 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #live_frame { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <iframe 
        id="live_frame" 
        src="about:blank" 
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        allow="fullscreen"
    >
    </iframe>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('live_frame');
            
            if (!iframe) {
                console.error("iFrame element with ID 'live_frame' not found.");
                return;
            }

            // 난독화 없이 전체 URL 사용
            const full_url = `https://view.shoppinglive.naver.com/externals/npay/lives/1765611?tr=lim&fm=shoppinglive&sn=home`;

            // JavaScript를 사용하여 iFrame의 src를 동적으로 설정하여 로드를 트리거합니다.
            if (iframe.contentWindow && iframe.contentWindow.location) {
                // about:blank 상태에서는 contentWindow 접근이 가능합니다.
                // location.replace()를 사용하여 내부 컨텍스트를 최종 URL로 이동시킵니다.
                iframe.contentWindow.location.replace(full_url);
                console.log("iFrame dynamic load triggered using location.replace: " + full_url);
            } else {
                // 대체 방법: contentWindow 접근이 실패하는 경우 (대부분의 모던 브라우저에서 잘 작동하지 않음)
                iframe.src = full_url;
                console.warn("Using fallback iFrame SRC assignment.");
            }
        });
    </script>

</body>
</html>
