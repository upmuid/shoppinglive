<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 쇼핑라이브 웹뷰 우회 테스트 (2초 지연 로드)</title>
    <style>
        /* 페이지 전체를 채우도록 설정 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #live_frame { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <iframe 
        id="live_frame" 
        src="" 
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        allow="fullscreen"
    >
    </iframe>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('live_frame');
            
            if (!iframe) {
                console.error("iFrame element with ID 'live_frame' not found.");
                return;
            }

            // --- 환경 설정 ---
            // 최종 쇼핑라이브 URL
            const final_live_url = `https://view.shoppinglive.naver.com/externals/npay/lives/1805050?tr=lim&fm=shoppinglive&sn=home`;
            
            // 더미 URL (요청하신 주소 적용)
            const dummy_url = `https://upmuid.github.io/shoppinglive/dummy.html`; 
            // ------------------

            let isDummyLoaded = false;

            // Step 4. 최종 라이브 URL로 변경하는 함수
            const setLiveUrl = () => {
                iframe.src = final_live_url;
                // 'onload' 핸들러가 최종 라이브 로드에도 다시 실행되는 것을 방지하기 위해 이벤트 리스너 제거
                iframe.onload = null; 
                console.log("Step 5. 최종 라이브 URL 로드 시작.");
            };
            
            // Step 2. iFrame에 'onload' 이벤트 리스너를 추가하여 더미 페이지 로드 완료를 감지
            iframe.onload = function() {
                if (!isDummyLoaded) {
                    isDummyLoaded = true;
                    console.log("Step 2. Dummy 페이지 로드 완료.");
                    console.log("Step 3. 2초(2000ms) 대기 시작...");
                    
                    // Step 3. 2초(2000ms) 지연 후 최종 URL 로드
                    setTimeout(() => {
                        // Step 4. 2초 후 최종 URL 로드 함수 호출
                        setLiveUrl();
                    }, 2000);
                }
            };

            // Step 1. 더미 URL을 iFrame의 src에 할당하여 로드를 시작합니다.
            console.log("Step 1. 더미 URL 로드 시작: " + dummy_url);
            iframe.src = dummy_url;
            
        });
    </script>

</body>
</html>
