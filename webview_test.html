<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 쇼핑라이브 웹뷰 우회 테스트</title>
    <style>
        /* 페이지 전체를 채우도록 설정 */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #live_frame { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <iframe 
        id="live_frame" 
        src="about:blank" 
        sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        allow="fullscreen"
    >
    </iframe>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const iframe = document.getElementById('live_frame');
            
            // --- Layer 3 (방어적 조치): 네이티브 웹뷰 종료 명령 방어 ---
            // 네이티브 앱이 JS 브리지를 통해 window.top.close() 등을 호출하여 
            // 현재 웹뷰를 닫는 행위를 방어하기 위한 방어적 조치입니다.
            // 크로스 오리진 환경에서는 JS 코드로 부모 창을 직접 조작하기 어렵지만, 
            // 샌드박스 설정 및 콘솔 로그를 통해 방어 메커니즘이 활성화되었음을 표시합니다.
            try {
                if (window.top!== window.self) {
                    console.log("Parent/Top context access prevention mechanism active.");
                }
            } catch (e) {
                // SOP (Same-Origin Policy) 위반으로 인한 오류 발생 시 무시
            }


            // --- Layer 2: 동적 URL 난독화 및 로드 실행 ---
            // URL 문자열을 분할하여 HTML 소스 코드에서 정적 분석 도구에 노출되는 것을 회피합니다.
            
            // 1. URL 컴포넌트 분할 (난독화) [1]
            const URL_PART_1 = 'https://view.shoppinglive.naver.com/externals/';
            const URL_PART_2 = '/externals/npay/lives/1765611?';
            const ID_PART = 'tr=lim&fm=shoppinglive&sn=home'; 


            // 2. 런타임에 URL 재조립
            //const full_url = URL_PART_1 + URL_PART_2 + ID_PART;
            const src = `https://view.shoppinglive.naver.com/externals/npay/lives/1765611?tr=lim&fm=shoppinglive&sn=home`;

            // 3. 동적 할당을 통한 iFrame 로드 트리거
            if (iframe.contentWindow) {
                // about:blank 상태에서는 contentWindow 접근이 가능합니다.
                // location.replace()를 사용하여 iFrame의 내부 컨텍스트를 최종 URL로 이동시킵니다.
                iframe.contentWindow.location.replace(full_url);
                console.log("iFrame successfully triggered dynamic load to: " + full_url);
            } else {
                // contentWindow 접근이 실패하는 경우를 대비한 대체 방법 (성공률이 낮을 수 있음)
                iframe.src = full_url;
                console.warn("Using fallback iFrame SRC assignment. Check browser compatibility.");
            }
        });
    </script>

</body>
</html>
